# This is an example configuration file for the Spello Consulting Foundation library

# Just an example section to show how to set up a section
AmberAPI:
  APIKey: ""
  BaseUrl: https://api.amber.com.au/v1
  Timeout: 16

Files:
  LogfileName: logs/dev_logfile.log
  LogfileMaxLines: 501
  TimestampFormat: "%Y-%m-%d %H:%M:%S.%f"
  LogProcessID: True
  LogThreadID: True
  LogfileVerbosity: all
  ConsoleVerbosity: detailed

# Enter your settings here if you want to be emailed when there's a critical error 
Email:
  EnableEmail: True
  SubjectPrefix: 

HeartbeatMonitor:
  Enable: True
  WebsiteURL: https://uptime.betterstack.com/api/v1/heartbeat/zcsNtnEQHRDNWJENvcZc94fx
  HeartbeatTimeout: 5
  Frequency: 20

Location:
  Latitude: -33.86
  Longitude: 151.21
  Timezone: "Australia/Sydney"
  GoogleMapsURL: "https://www.google.com/maps/place/Sydney+NSW/@-33.8688,151.2093,15z"